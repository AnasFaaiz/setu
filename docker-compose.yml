services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: setu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: setu
    ports:
      - "5432:5432"
    volumes:
      - setu_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://setu:${POSTGRES_PASSWORD}@postgres:5432/setu
    depends_on:
      - postgres

  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://setu:${POSTGRES_PASSWORD}@postgres:5432/setu
      PYTHONUNBUFFERED: "1"
    depends_on:
      - postgres

volumes:
  setu_pgdata:
