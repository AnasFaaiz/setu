services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: setu 
      POSTGRES_PASSWORD: setu_dev_pass
      POSTGRES_DB: setu
    ports:
      - "5432:5432"
    volumes:
      - setu_pgdata:/var/lib/postgresql/data

volumes:
  setu_pgdata:
