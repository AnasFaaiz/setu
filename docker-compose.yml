services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: setu 
      POSTGRES_PASSWORD: setu_dev_pass
      POSTGRES_DB: setu
    ports:
      - "5432:5432"
    volumes:
      - setu_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api 
    ports:
      - "8000:8000"
    env_file:
      - .env 
    environment: 
      DATABASE_URL: postgresql://setu:setu_dev_pass@postgres:5432/setu 
      REDIS_HOST: redis 
    depends_on:
      - postgres 
      - redis 

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker 
    env_file:
      - .env 
    environment:
      DATABASE_URL: postgresql://setu:setu_dev_pass@postgres:5432/setu 
      REDIS_HOST: redis 
    depends_on:
      - postgres
      - redis

volumes:
  setu_pgdata:
